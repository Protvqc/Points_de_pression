<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Points de Pression - ENPQ Trainer</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0f1a">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <section id="screen-home" class="screen active">
    <div class="glow-orb"></div>
    <h1>🎯 Points de Pression</h1>
    <p class="subtitle">Entraînement ENPQ — 13 points de contrôle physique</p>

    <div class="menu-buttons">
      <button class="btn btn-primary" data-action="start-classic"><span class="ic">▶</span> Mode Classique</button>
      <button class="btn btn-accent2" data-action="start-chrono"><span class="ic">⏱</span> Mode Chrono</button>
      <button class="btn btn-ghost" data-action="start-review"><span class="ic">📖</span> Révision libre</button>
      <button class="btn btn-ghost" data-action="show-category-select"><span class="ic">🗂</span> Par catégorie</button>
    </div>

    <div class="stats-mini" id="home-stats"></div>
  </section>

  <section id="screen-category" class="screen">
    <h2>Choisis une catégorie</h2>
    <div class="category-list" id="category-list"></div>
    <button class="btn btn-back" data-action="go-home">← Retour</button>
  </section>

  <section id="screen-game" class="screen">
    <div class="game-header">
      <button class="btn-icon" data-action="go-home">✕</button>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div id="chrono-display" class="chrono hidden">00:00.0</div>
    </div>

    <div class="prompt-box">
      <div class="prompt-label">Trouve ce point :</div>
      <div class="prompt-name" id="prompt-name">—</div>
    </div>

    <div class="score-row">
      <span class="chip">Score <strong id="score-value">0</strong></span>
      <span class="chip chip-fire">🔥 <strong id="streak-value">0</strong></span>
      <span class="chip" id="counter-value">1 / 13</span>
    </div>

    <div class="body-wrap">
      <svg id="body-svg" viewBox="0 0 100 130" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#5b7fb8"/>
            <stop offset="100%" stop-color="#324a6e"/>
          </linearGradient>
          <filter id="bodyShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000" flood-opacity="0.35"/>
          </filter>
        </defs>

        <g id="silhouette" fill="url(#bodyGrad)" stroke="#1e2a3f" stroke-width="0.4" filter="url(#bodyShadow)">
          <ellipse cx="50" cy="10" rx="7" ry="8"/>
          <rect x="46" y="16" width="8" height="6" rx="2"/>
          <path d="M 38 22
                   C 34 22 31 26 30 32
                   L 28 46
                   C 27.5 49 29 50 31 50
                   L 34 50
                   L 36 33
                   C 37 26 40 23 50 23
                   C 60 23 63 26 64 33
                   L 66 50
                   L 69 50
                   C 71 50 72.5 49 72 46
                   L 70 32
                   C 69 26 66 22 62 22
                   C 58 20 42 20 38 22 Z"/>
          <path d="M 30 32 C 24 34 19 40 17 48 L 14 62 C 13.5 64 15 65.5 17 65 C 19 64.5 19.5 63 20 61
                   L 24 49 C 25.5 44 28 39 32 36 Z"/>
          <path d="M 70 32 C 76 34 81 40 83 48 L 86 62 C 86.5 64 85 65.5 83 65 C 81 64.5 80.5 63 80 61
                   L 76 49 C 74.5 44 72 39 68 36 Z"/>
          <ellipse cx="16" cy="68" rx="3.6" ry="4.2"/>
          <ellipse cx="84" cy="68" rx="3.6" ry="4.2"/>
          <path d="M 34 50 L 66 50 L 65 58 L 35 58 Z"/>
          <path d="M 35 58 C 33 68 32.5 80 33 92 L 34 108 C 34 110 36 111 38 110.5 C 39.5 110 40 108.5 40 107
                   L 41 92 C 41.5 80 42.5 68 44 58 Z"/>
          <path d="M 65 58 C 67 68 67.5 80 67 92 L 66 108 C 66 110 64 111 62 110.5 C 60.5 110 60 108.5 60 107
                   L 59 92 C 58.5 80 57.5 68 56 58 Z"/>
          <ellipse cx="36.5" cy="113" rx="5.5" ry="3"/>
          <ellipse cx="63.5" cy="113" rx="5.5" ry="3"/>
        </g>

        <g id="clickable-zones"></g>
      </svg>

      <div id="reveal-marker" class="reveal-marker hidden"></div>
    </div>

    <div id="feedback-flash" class="feedback-flash"></div>
  </section>

  <div id="explain-card" class="explain-card hidden">
    <div class="explain-card-inner">
      <div class="explain-result" id="explain-result"></div>
      <h3 id="explain-nom"></h3>
      <div class="explain-row"><span class="explain-label">Emplacement</span><span id="explain-lieu"></span></div>
      <div class="explain-row"><span class="explain-label">Méthode</span><span id="explain-methode"></span></div>
      <div class="explain-row"><span class="explain-label">Mécanisme</span><span id="explain-mecanisme"></span></div>
      <div class="explain-row"><span class="explain-label">Type d'utilisation</span><span id="explain-type"></span></div>
      <div class="explain-verbal" id="explain-verbal"></div>
      <button class="btn btn-primary" id="btn-next">Continuer →</button>
    </div>
  </div>

  <section id="screen-results" class="screen">
    <h2>🏁 Résultats</h2>
    <div class="results-box">
      <div class="result-big" id="result-percent">0%</div>
      <div class="result-sub" id="result-detail"></div>
      <div id="result-time" class="result-sub"></div>
    </div>
    <div id="result-weak-categories" class="weak-cats"></div>
    <div class="menu-buttons">
      <button class="btn btn-primary" data-action="replay">🔁 Rejouer</button>
      <button class="btn btn-ghost" data-action="go-home">🏠 Accueil</button>
    </div>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
